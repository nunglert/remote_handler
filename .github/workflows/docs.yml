name: Docs

# Build the Sphinx docs and deploy them to GitHub Pages from `main`. Needs
# Settings > Pages > Source set to "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let an in-progress one finish rather than cancel it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tags, so the docs show the real version
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build docs
        run: |
          pip install --upgrade pip
          # Editable install with docs deps so autodoc can import the modules.
          pip install -e ".[docs]"
          cd docs && make html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
