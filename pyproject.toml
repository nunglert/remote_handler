# -*- coding: utf-8 -*-

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "remote_handler"
authors = [
    { name = "Nico Unglert", email = "nico.unglert@tuwien.ac.at" }
]
description = "Package for streamlining active learning workflows"
requires-python = ">=3.9,<3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
    "Natural Language :: English"
]
dependencies = [
    "jinja2",
    "numpy",
    "paramiko",
    "natsort",
    "ase",
]
readme = "README.md"
dynamic = ["version"]

[project.optional-dependencies]
dev = [
    "pytest==7.4.0", 
    "pytest-lazy-fixture",
    "pre-commit"
]
doc = ["sphinx", "sphinx-autodoc-typehints", "sphinx-rtd-theme"]

[project.urls]
"Homepage" = "https://gitlab.tuwien.ac.at/e165-03-1_theoretische_materialchemie/madsen-s-research-group/remote_handler"

[tool.setuptools.packages.find]
where = ["src"]


