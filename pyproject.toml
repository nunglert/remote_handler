# -*- coding: utf-8 -*-

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "remote_handler"
authors = [
    { name = "Nico Unglert", email = "nico.unglert@tuwien.ac.at" }
]
description = "Package for streamlining active learning workflows"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
    "Natural Language :: English"
]
dependencies = [
    "jinja2==3.1.6",
    "numpy==2.2.6",
    "paramiko==3.5.1",
    "natsort==8.4.0",
    "ase==3.25.0",
    "pyyaml>=6.0",
]
readme = "README.md"
dynamic = ["version"]

[project.optional-dependencies]
dev = [
    "pytest==7.4.0",
    "pre-commit"
]
docs = [
    "sphinx>=7.0",
    "sphinx-autodoc-typehints",
    "sphinx-rtd-theme",
]
torchsim = [
    "mace-torch==0.3.14",
    "torch-sim-atomistic==0.5.1",
    "cuequivariance-torch==0.8.1",
]
mace = [
    "mace-torch==0.3.14",
    "cuequivariance-torch==0.8.1",
]
clinamen = [
    "Clinamen2"
]


[project.urls]
"Homepage" = "https://gitlab.tuwien.ac.at/e165-03-1_theoretische_materialchemie/madsen-s-research-group/remote_handler"

[tool.setuptools.packages.find]
where = ["src"]


