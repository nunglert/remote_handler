# -*- coding: utf-8 -*-

[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "remote_handler"
authors = [
    { name = "Nico Unglert", email = "nico.unglert@tuwien.ac.at" }
]
description = "Package for streamlining active learning workflows"
license = "MIT"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
    "Natural Language :: English"
]
dependencies = [
    "jinja2>=3.1",
    "numpy>=2.0",
    "paramiko>=3.0",
    "natsort>=8.0",
    "ase>=3.23",
    "pyyaml>=6.0",
]
readme = "README.md"
# Version is derived from git tags by setuptools-scm (see [tool.setuptools_scm]).
dynamic = ["version"]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov",
    "pre-commit"
]
docs = [
    "sphinx>=7.0",
    "sphinx-autodoc-typehints",
    "sphinx-rtd-theme",
    "sphinx-autobuild",
    "sphinxcontrib-mermaid",
]
mace = [
    "mace-torch>=0.3.14",
    "cuequivariance-torch>=0.8.1",
]
mace_freeze = [
    "mace-torch @ git+https://github.com/7radians/mace-freeze.git@mace-freeze",
    "cuequivariance-torch>=0.8.1",
]
quests = [
    "quests>=2025.9.29"
]
neuralil = [
    "neuralil @ git+https://github.com/nunglert/neuralil-jaxrens.git@jaxrens",
    "pandas",
    "tqdm",
]
mace_jax = [
    "mace-jax @ git+https://github.com/nunglert/mace-jax.git@fixes",
]
steinhardt = [
    "jax>=0.9.0",
]
# pacemaker (the ACE fitting tool, repo name "python-ace") is not published
# on PyPI under any usable name: "pip install pacemaker"/"pyace" both exist
# on PyPI but are unrelated packages (a rate-limiting helper and a chord-
# estimation library, respectively). The real package declares its own name
# as "pyace" (see its setup.py) even though the repo is "python-ace" -- pip
# requires the two to match for a direct URL requirement, hence the name
# below. Tracks master rather than the "0.2.8" tag: 0.2.8's vendored
# pybind11 predates CPython 3.11's opaque frame-object layout and fails to
# compile there ("invalid use of incomplete type 'PyFrameObject'"); master
# builds fine on 3.11+. (Note: master's ``bin/pacemaker`` has had a latent
# bug since Nov 2023 -- commit 29ba519 dropped the ``--query-data`` argparse
# flag but left two ``args_parse.query_data`` reads behind, crashing with
# ``AttributeError`` -- but it only fires when the input YAML omits a
# ``backend`` section, which ``ace_utils.merge_ace_config_with_paths``
# always supplies, so it's avoided rather than hit.) It ships compiled C++
# extensions built via CMake, so this also needs cmake + a C++ compiler
# (and see that repo's README for the optional maxvolpy sub-install); it is
# not pip-installable as a plain version pin the way the other extras are,
# and conda-forge is the more common install route.
ace = [
    "pyace @ git+https://github.com/ICAMS/python-ace.git",
]
grace = [
    "tensorpotential>=0.6.1",
]

all = [
    "remote_handler[dev,mace_freeze,quests,neuralil,mace_jax,steinhardt,grace,ace]"
]

[project.scripts]
remote_handler = "remote_handler.cli:main"

[project.urls]
"Homepage" = "https://gitlab.tuwien.ac.at/e165-03-1_theoretische_materialchemie/madsen-s-research-group/remote_handler"

# Version comes from git tags (e.g. ``v0.2.0`` -> ``0.2.0``); commits past a
# tag get a dev version like ``0.2.1.dev3+g<sha>``. ``fallback_version`` keeps
# installs working where git history/tags are unavailable (e.g. a shallow CI
# clone or a tarball) instead of erroring. NOTE: for CI to compute the *real*
# version it needs the tags -- a full clone (GIT_DEPTH: 0), set in .gitlab-ci.
[tool.setuptools_scm]
fallback_version = "0.0.0"

[tool.setuptools.packages.find]
where = ["src"]

# Ship the built-in SLURM job templates inside the installed package; without
# this they are missing from a real (non-editable) install and find_template()
# fails at runtime. (Editable installs mask this by pointing back at src/.)
[tool.setuptools.package-data]
remote_handler = ["templates/*.j2"]


[tool.pytest.ini_options]
testpaths = ["test"]
# Test tiers, grouped by what the environment must provide:
#   (unmarked) unit  -- pure logic, no special deps; always run.
#   integration      -- needs the ML stack (mace); opt in.
#   slurm            -- needs a working local sbatch; opt in (also integration).
#   sshlive          -- needs Docker (dummy remote); opt in.
#   remote           -- needs a configured live cluster; runs but self-skips.
# Default run = unit only: integration and sshlive are deselected here; the
# remote tier is left in so it reports an informative skip when unconfigured.
# -ra prints a summary of skip/xfail/error reasons so nothing is hidden.
addopts = "-m 'not remote' -ra"
markers = [
    "remote: needs a configured live cluster; auto-skips when REMOTE_HANDLER_CONFIG_DIR/remote.json is absent",
    "local: file-handler variant running against the local filesystem; no cluster needed",
    "integration: needs the ML stack (mace) installed; deselected by default",
    "slurm: needs a working local sbatch (job-submission orchestration); auto-skips when sbatch is absent",
    "sshlive: real SSH/SFTP round-trip against a throwaway Docker container; auto-skips when Docker is unavailable; deselected by default",
]

[tool.coverage.run]
source_pkgs = ["remote_handler"]
branch = true

[tool.coverage.paths]
# Map the installed copy (CI does a non-editable install, so coverage measures
# site-packages) back onto the src tree, so the cobertura report's file paths
# are repo-relative -- required for GitLab's MR line-coverage visualization.
source = ["src/remote_handler", "*/site-packages/remote_handler"]
