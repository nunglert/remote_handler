# -*- coding: utf-8 -*-

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "remote_handler"
authors = [
    { name = "Nico Unglert", email = "nico.unglert@tuwien.ac.at" }
]
description = "Package for streamlining active learning workflows"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
    "Natural Language :: English"
]
dependencies = [
    "jinja2==3.1.6",
    "numpy==2.2.6",
    "paramiko==3.5.1",
    "natsort==8.4.0",
    "ase==3.25.0",
    "pyyaml>=6.0",
]
readme = "README.md"
version = "0.1.0"

[project.optional-dependencies]
dev = [
    "pytest==7.4.0",
    "pytest-cov",
    "pre-commit"
]
docs = [
    "sphinx>=7.0",
    "sphinx-autodoc-typehints",
    "sphinx-rtd-theme",
]
torch_sim = [
    "mace-torch==0.3.14",
    "torch-sim-atomistic==0.5.1",
    "cuequivariance-torch==0.8.1",
]
mace = [
    "mace-torch==0.3.14",
    "cuequivariance-torch==0.8.1",
]
# MACE fork adding layer-freezing for finetuning (MaceFinetuningTrainer /
# MACE_FREEZE_TRAIN_RUNNER). It builds the `mace-torch` distribution from git,
# so it REPLACES mace-torch -- install in its own environment; do not combine
# with [mace] or [torch_sim] (same package, conflicting sources).
mace_freeze = [
    "mace-torch @ git+https://github.com/7radians/mace-freeze.git@mace-freeze",
]
# torch_sim with the freeze fork instead of stock mace-torch. Self-contained:
# its only mace-torch source is the git fork, so there is no conflicting
# requirement (unlike combining [torch_sim] + [mace_freeze]). Mutually
# exclusive with [mace]/[torch_sim]/[mace_freeze] -- pick one mace-torch source.
torch_sim_freeze = [
    "torch-sim-atomistic==0.5.1",
    "cuequivariance-torch==0.8.1",
    "mace-torch @ git+https://github.com/7radians/mace-freeze.git@mace-freeze",
]
clinamen = [
    "Clinamen2"
]
quests = [
    "quests==2025.9.29"
]
# NeuralIL force-field training (remote-side payload
# `remote_handler.scripts.neuralil.train_model`, run by `NeuralilILTrainer`).
# This payload no longer depends on `jaxnest` -- the small closure it used is
# vendored under `scripts/neuralil/_support/`. The NeuralIL library is pulled
# from the group's git fork (not on PyPI); it brings in jax/flax transitively.
neuralil = [
    "neuralil @ git+https://github.com/nunglert/neuralil-jaxrens.git@jaxrens",
    "pandas",
    "tqdm",
]
# mace-jax, for converting a trained torch MACE model to a mace-jax `.pkl`
# bundle (MaceFinetuningTrainer(convert_to_jax=True)). The conversion needs a
# torch MACE source too (it reads the .model via `mace.tools.scripts_utils`),
# so install alongside a mace extra, e.g. `.[mace_freeze,mace_jax]`.
mace_jax = [
    "mace-jax @ git+https://github.com/ACEsuit/mace-jax.git",
]

[project.scripts]
remote_handler = "remote_handler.cli:main"

[project.urls]
"Homepage" = "https://gitlab.tuwien.ac.at/e165-03-1_theoretische_materialchemie/madsen-s-research-group/remote_handler"

[tool.setuptools.packages.find]
where = ["src"]

# Ship the built-in SLURM job templates inside the installed package; without
# this they are missing from a real (non-editable) install and find_template()
# fails at runtime. (Editable installs mask this by pointing back at src/.)
[tool.setuptools.package-data]
remote_handler = ["templates/*.j2"]


[tool.pytest.ini_options]
testpaths = ["test"]
# Test tiers, grouped by what the environment must provide:
#   (unmarked) unit  -- pure logic, no special deps; always run.
#   integration      -- needs the ML stack (mace/torch_sim/clinamen); opt in.
#   slurm            -- needs a working local sbatch; opt in (also integration).
#   sshlive          -- needs Docker (dummy remote); opt in.
#   remote           -- needs a configured live cluster; runs but self-skips.
# Default run = unit only: integration and sshlive are deselected here; the
# remote tier is left in so it reports an informative skip when unconfigured.
# -ra prints a summary of skip/xfail/error reasons so nothing is hidden.
addopts = "-m 'not integration and not sshlive' -ra"
markers = [
    "remote: needs a configured live cluster; auto-skips when REMOTE_HANDLER_CONFIG_DIR/remote.json is absent",
    "local: file-handler variant running against the local filesystem; no cluster needed",
    "integration: needs the ML stack (mace/torch_sim/clinamen) installed; deselected by default",
    "slurm: needs a working local sbatch (job-submission orchestration); auto-skips when sbatch is absent",
    "sshlive: real SSH/SFTP round-trip against a throwaway Docker container; auto-skips when Docker is unavailable; deselected by default",
    "heavy: slow tests",
]


