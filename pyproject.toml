# -*- coding: utf-8 -*-

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "remote_handler"
authors = [
    { name = "Nico Unglert", email = "nico.unglert@tuwien.ac.at" }
]
description = "Package for streamlining active learning workflows"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
    "Natural Language :: English"
]
dependencies = [
    "jinja2==3.1.6",
    "numpy==2.2.6",
    "paramiko==3.5.1",
    "natsort==8.4.0",
    "ase==3.25.0",
    "pyyaml>=6.0",
]
readme = "README.md"
dynamic = ["version"]

[project.optional-dependencies]
dev = [
    "pytest==7.4.0",
    "pytest-cov",
    "pre-commit"
]
docs = [
    "sphinx>=7.0",
    "sphinx-autodoc-typehints",
    "sphinx-rtd-theme",
]
torch_sim = [
    "mace-torch==0.3.14",
    "torch-sim-atomistic==0.5.1",
    "cuequivariance-torch==0.8.1",
]
mace = [
    "mace-torch==0.3.14",
    "cuequivariance-torch==0.8.1",
]
clinamen = [
    "Clinamen2"
]
quests = [
    "quests==2025.9.29"
]

[project.urls]
"Homepage" = "https://gitlab.tuwien.ac.at/e165-03-1_theoretische_materialchemie/madsen-s-research-group/remote_handler"

[tool.setuptools.packages.find]
where = ["src"]

# Ship the built-in SLURM job templates inside the installed package; without
# this they are missing from a real (non-editable) install and find_template()
# fails at runtime. (Editable installs mask this by pointing back at src/.)
[tool.setuptools.package-data]
remote_handler = ["templates/*.j2"]


[tool.pytest.ini_options]
testpaths = ["test"]
# Integration tests need external tools/models and live clusters; opt in with
# `pytest -m integration`. Remote-tier tests are not deselected here -- they
# skip themselves (with a reason) when no cluster config is available.
# -ra prints a summary of skip/xfail/error reasons so nothing is hidden.
addopts = "-m 'not integration' -ra"
markers = [
    "remote: needs a live remote cluster; auto-skips when REMOTE_HANDLER_CONFIG_DIR/remote.json is absent",
    "local: runs against the local filesystem; no cluster needed",
    "integration: end-to-end tests needing external tools/models or a live cluster; deselected by default",
    "heavy: slow tests",
]


