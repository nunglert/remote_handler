stages:
  - test
  - deploy

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip

# Run tests
test:
  stage: test
  image: python:3.10
  tags:
    - shared
  before_script:
    - pip install --upgrade pip
    - pip install -e ".[dev]"
  script:
    - pytest -v --tb=short
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    reports:
      junit: test-results.xml
    when: always
  only:
    - main
    - merge_requests

# Build and deploy documentation to GitLab Pages
pages:
  stage: deploy
  image: python:3.10
  tags:
    - shared
  before_script:
    - pip install --upgrade pip
    # Install package with all dependencies (needed for autodoc to import modules)
    - pip install -e .
    # Install documentation dependencies
    - pip install -e ".[docs]"
    # Verify installation
    - python -c "import remote_handler; print(f'Successfully imported remote_handler from {remote_handler.__file__}')"
    - python -c "import remote_handler.config; print('Config module imported successfully')"
  script:
    # Build the Sphinx documentation
    - cd docs
    - make html
    - cd ..
    # GitLab Pages expects output in 'public' directory
    - mv docs/build/html public
  artifacts:
    paths:
      - public
    expire_in: 1 week
  only:
    - main  # Only deploy docs from main branch
  dependencies: []
